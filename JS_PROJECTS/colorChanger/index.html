<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Color Changer</title>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Color Changer</h1>
      <div class="inputButton">
        <button class="random">Random Color</button>
        <input id="input" type="text" placeholder="Enter a color/hex" />
        <button class="apply">Apply Color</button>
      </div>
      <p>Current Color: <span class="current">#a2c0c0</span></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
